<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pengumuman Kelulusan - SMPN 1 Bandar Lampung</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & ReactDOM CDNs -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Babel untuk kompilasi JSX langsung di browser -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Poppins', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght=300;400;600;700;900&display=swap');
    body { font-family: 'Poppins', sans-serif; transition: background-color 0.3s ease; }
    .footer-text { font-family: Arial, sans-serif !important; }
    @keyframes bounce-short { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
    .animate-bounce-short { animation: bounce-short 0.3s ease-out; }
    @keyframes fade-in-up { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    .animate-fade-in-up { animation: fade-in-up 0.5s ease-out; }
    @media print { .no-print { display: none !important; } }
  </style>
</head>
<body class="bg-white dark:bg-slate-900 transition-colors duration-300">

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // --- ICON COMPONENTS ---
    const SearchIcon = ({ size = 20, className = "" }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
    );
    const MoonIcon = ({ size = 20, className = "" }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
    );
    const SunIcon = ({ size = 20, className = "" }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>
    );
    const MaximizeIcon = ({ size = 20, className = "" }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="m15 3 6 6"/><path d="M9 21 3 15"/><path d="M21 3v6h-6"/><path d="M3 21v-6h6"/></svg>
    );
    const CheckCircleIcon = ({ size = 20, className = "" }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></svg>
    );
    const XCircleIcon = ({ size = 20, className = "" }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="10"/><path d="m15 9-6 6"/><path d="m9 9 6 6"/></svg>
    );
    const DownloadIcon = ({ size = 20, className = "" }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>
    );
    const LockIcon = ({ size = 20, className = "" }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
    );
    const LogOutIcon = ({ size = 20, className = "" }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" x2="9" y1="12" y2="12"/></svg>
    );
    const EditIcon = ({ size = 20, className = "" }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
    );
    const Trash2Icon = ({ size = 20, className = "" }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" x2="10" y1="11" y2="17"/><line x1="14" x2="14" y1="11" y2="17"/></svg>
    );
    const GraduationCapIcon = ({ size = 20, className = "" }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M21.42 10.922a1 1 0 0 0-.019-1.838L12.83 5.18a2 2 0 0 0-1.66 0L2.6 9.08a1 1 0 0 0 0 1.832l8.57 3.91a2 2 0 0 0 1.66 0z"/><path d="M6 12v5c0 2 2 3 6 3s6-1 6-3v-5"/></svg>
    );
    const ShieldAlertIcon = ({ size = 20, className = "" }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/></svg>
    );
    const Volume2Icon = ({ size = 20, className = "" }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>
    );
    const VolumeXIcon = ({ size = 20, className = "" }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="22" x2="16" y1="9" y2="15"/><line x1="16" x2="22" y1="9" y2="15"/></svg>
    );
    const MenuIcon = ({ size = 24, className = "" }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="18" y2="18"/></svg>
    );

    // --- DATA SISWA INITIAL ---
    const INITIAL_STUDENTS = [
      { id: 1, nisn: "0012345678", name: "Budi Santoso", kelas: "IX A", status: "LULUS" },
      { id: 2, nisn: "0012345679", name: "Siti Aminah", kelas: "IX B", status: "LULUS" },
      { id: 3, nisn: "0012345680", name: "Andi Wijaya", kelas: "IX C", status: "TIDAK LULUS" },
      { id: 4, nisn: "0012345681", name: "Rina Melati", kelas: "IX A", status: "LULUS" },
      { id: 5, nisn: "0012345682", name: "Dimas Anggara", kelas: "IX B", status: "DITUNDA" },
      { id: 6, nisn: "12345", name: "Siswa Uji Coba Sistem", kelas: "IX Admin", status: "LULUS" } // Siswa khusus uji coba bypass
    ];

    const ANNOUNCEMENT_DATE = new Date("2026-06-01T23:59:00+07:00").getTime();
    
    // URL Backend Google Apps Script
    const GAS_URL = "https://script.google.com/macros/s/AKfycbyuccQQNle304Ulu8t8wTlmW4AbANLoBtTMhNAaM7F0taQ4gQfQw4gJ2xJN_3mRin-3Qw/exec"; 

    // --- MAIN REACT COMPONENT ---
    function App() {
      const [currentPath, setCurrentPath] = useState('home');
      const [isDarkMode, setIsDarkMode] = useState(false);
      const [isFullscreen, setIsFullscreen] = useState(false);
      const [isMobileMenuOpen, setIsMobileMenuOpen] = useState(false);
      const [musicPlaying, setMusicPlaying] = useState(false);
      
      const [searchQuery, setSearchQuery] = useState('');
      const [searchResult, setSearchResult] = useState(null); 
      
      const [isAdminLoggedIn, setIsAdminLoggedIn] = useState(false);
      const [adminPin, setAdminPin] = useState('');
      const [studentsData, setStudentsData] = useState(INITIAL_STUDENTS);
      const [isLoadingData, setIsLoadingData] = useState(false);

      // --- MODAL STATES ---
      const [editingStudent, setEditingStudent] = useState(null);
      const [deletingStudent, setDeletingStudent] = useState(null);

      const [toast, setToast] = useState({ show: false, message: '', type: 'success' });

      const audioRef = useRef(null);
      const fileInputRef = useRef(null);
      const hasAutoSearched = useRef(false);

      // 👉 FETCH DATA AWAL
      useEffect(() => {
        if (GAS_URL) {
          setIsLoadingData(true);
          fetch(`${GAS_URL}?action=getData`)
            .then(res => res.json())
            .then(res => {
              if (res.status === 'success' && res.data) {
                const formattedData = res.data.map((item, index) => ({
                  id: item.id || Date.now() + index,
                  ...item
                }));
                // Pastikan NISN 12345 tetap ada walaupun mengambil data dari Spreadsheet
                const updatedData = [...formattedData];
                if (!updatedData.some(s => s.nisn === "12345")) {
                  updatedData.push({ id: 99999, nisn: "12345", name: "Siswa Uji Coba Sistem", kelas: "IX Admin", status: "LULUS" });
                }
                setStudentsData(updatedData);
                showToast('Data berhasil dimuat', 'success');
              }
            })
            .catch(() => showToast('Gagal memuat database', 'error'))
            .finally(() => setIsLoadingData(false));
        }
      }, []);

      // 👉 AUTO-SEARCH DARI QR DENGAN CHECK STATUS WAKTU countdown
      useEffect(() => {
        if (hasAutoSearched.current || isLoadingData || studentsData.length === 0) return;
        const params = new URLSearchParams(window.location.search);
        const nisnParam = params.get('nisn');
        if (nisnParam) {
          hasAutoSearched.current = true;
          
          // Cek waktu rilis pengumuman, kecuali untuk NISN '12345'
          const now = new Date().getTime();
          if (now < ANNOUNCEMENT_DATE && nisnParam !== '12345') {
            showToast('Pengumuman Belum Dimulai!', 'error');
            setCurrentPath('cek');
            return;
          }

          setSearchQuery(nisnParam);
          setCurrentPath('cek');
          setSearchResult('loading');
          setTimeout(() => {
            const result = studentsData.find(s => s.nisn === nisnParam);
            setSearchResult(result || 'not_found');
          }, 800);
        }
      }, [studentsData, isLoadingData]);

      useEffect(() => {
        if (isDarkMode) document.documentElement.classList.add('dark');
        else document.documentElement.classList.remove('dark');
      }, [isDarkMode]);

      const showToast = (message, type = 'success') => {
        setToast({ show: true, message, type });
        setTimeout(() => setToast({ show: false, message: '', type: 'success' }), 3000);
      };

      // 👉 PERBAIKAN ERROR LAYAR PENUH (MENCEGAH ERROR TYPEERROR: DISALLOWED BY PERMISSIONS POLICY)
      const toggleFullscreen = () => {
        try {
          if (!document.fullscreenEnabled) {
            showToast('Layar penuh dibatasi oleh kebijakan keamanan browser', 'error');
            return;
          }
          if (!document.fullscreenElement) {
            const req = document.documentElement.requestFullscreen();
            if (req && typeof req.catch === 'function') {
              req.then(() => setIsFullscreen(true))
                 .catch(() => {
                   showToast('Gagal mengaktifkan layar penuh', 'error');
                   setIsFullscreen(false);
                 });
            } else {
              setIsFullscreen(true);
            }
          } else {
            const exit = document.exitFullscreen();
            if (exit && typeof exit.catch === 'function') {
              exit.then(() => setIsFullscreen(false))
                  .catch(() => {
                    setIsFullscreen(false);
                  });
            } else {
              setIsFullscreen(false);
            }
          }
        } catch (error) {
          showToast('Fitur layar penuh tidak didukung di lingkungan ini', 'error');
          setIsFullscreen(false);
        }
      };

      const toggleMusic = () => {
        if (musicPlaying) audioRef.current?.pause();
        else audioRef.current?.play().catch(() => {});
        setMusicPlaying(!musicPlaying);
      };

      // 👉 VALIDASI WAKTU PENGUMUMAN & BYPASS "12345" SAAT SUBMIT CARI
      const handleSearch = (e) => {
        e.preventDefault();
        if (!searchQuery.trim()) return showToast('Masukkan NISN', 'error');

        const now = new Date().getTime();
        // Proteksi countdown waktu rilis, bypass jika NISN adalah '12345'
        if (now < ANNOUNCEMENT_DATE && searchQuery !== '12345') {
          showToast('Pengumuman Belum Dimulai!', 'error');
          setSearchResult('not_started');
          return;
        }

        setSearchResult('loading');
        setTimeout(() => {
          const result = studentsData.find(s => s.nisn === searchQuery);
          setSearchResult(result || 'not_found');
          if (result) showToast('Data ditemukan', 'success');
        }, 800);
      };

      const handleAdminLogin = (e) => {
        e.preventDefault();
        if (adminPin === 'admin1') {
          setIsAdminLoggedIn(true);
          showToast('Login Berhasil', 'success');
        } else showToast('PIN Salah', 'error');
      };

      // --- AKSI DATA ---
      const deleteStudent = () => {
        if (!deletingStudent) return;
        setStudentsData(prev => prev.filter(s => s.id !== deletingStudent.id));
        showToast(`Data ${deletingStudent.name} berhasil dihapus`, 'success');
        setDeletingStudent(null);
      };

      const updateStudent = (e) => {
        e.preventDefault();
        const formData = new FormData(e.target);
        const updated = {
          ...editingStudent,
          name: formData.get('name'),
          nisn: formData.get('nisn'),
          kelas: formData.get('kelas'),
          status: formData.get('status')
        };
        setStudentsData(prev => prev.map(s => s.id === updated.id ? updated : s));
        showToast('Data berhasil diperbarui', 'success');
        setEditingStudent(null);
      };

      const downloadQR = (nisn) => {
        const baseUrl = window.location.origin + window.location.pathname;
        const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=${encodeURIComponent(baseUrl + '?nisn=' + nisn)}`;
        fetch(qrUrl).then(res => res.blob()).then(blob => {
          const url = window.URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = `QR_${nisn}.png`;
          a.click();
        });
      };

      const Toast = () => toast.show && (
        <div className={`fixed bottom-5 right-5 z-[100] flex items-center p-4 rounded-xl shadow-2xl animate-bounce-short ${toast.type === 'success' ? 'bg-emerald-500' : 'bg-red-500'} text-white`}>
          {toast.type === 'success' ? <CheckCircleIcon size={20} className="mr-2" /> : <XCircleIcon size={20} className="mr-2" />}
          <span className="font-medium text-sm">{toast.message}</span>
        </div>
      );

      const Navbar = () => (
        <nav className="sticky top-0 z-50 bg-slate-900/90 backdrop-blur-md border-b border-white/10 text-white px-4 h-20 flex items-center justify-between no-print">
          <div className="flex items-center space-x-3 cursor-pointer" onClick={() => setCurrentPath('home')}>
            <div className="bg-yellow-500 p-2 rounded-xl"><GraduationCapIcon size={24} className="text-slate-900" /></div>
            <div>
              <h1 className="font-bold text-sm md:text-lg leading-tight">SMPN 1</h1>
              <p className="text-[8px] md:text-[10px] text-yellow-400 font-bold uppercase tracking-widest">Bandar Lampung</p>
            </div>
          </div>
          <div className="hidden md:flex items-center space-x-6">
            <button onClick={() => setCurrentPath('home')} className={currentPath === 'home' ? 'text-yellow-400 font-bold underline' : ''}>Beranda</button>
            <button onClick={() => setCurrentPath('cek')} className={currentPath === 'cek' ? 'text-yellow-400 font-bold underline' : ''}>Pengumuman</button>
            <button onClick={() => setCurrentPath('admin')} className={currentPath === 'admin' ? 'text-yellow-400 font-bold underline' : ''}>Admin</button>
            <div className="flex items-center space-x-3 border-l border-white/20 pl-6">
               <button onClick={toggleMusic} className="p-2 hover:bg-white/10 rounded-full">{musicPlaying ? <Volume2Icon size={20}/> : <VolumeXIcon size={20} className="text-slate-500"/>}</button>
               <button onClick={() => setIsDarkMode(!isDarkMode)} className="p-2 hover:bg-white/10 rounded-full text-yellow-400"><SunIcon size={20}/></button>
               <button onClick={toggleFullscreen} className="p-2 hover:bg-white/10 rounded-full"><MaximizeIcon size={20}/></button>
            </div>
          </div>
          <button onClick={() => setIsMobileMenuOpen(!isMobileMenuOpen)} className="md:hidden p-2"><MenuIcon size={24}/></button>
          {isMobileMenuOpen && (
            <div className="absolute top-20 left-0 w-full bg-slate-800 p-4 border-t border-white/10 flex flex-col space-y-4 md:hidden animate-fade-in-up">
              <button onClick={() => {setCurrentPath('home'); setIsMobileMenuOpen(false)}}>Beranda</button>
              <button onClick={() => {setCurrentPath('cek'); setIsMobileMenuOpen(false)}}>Pengumuman</button>
              <button onClick={() => {setCurrentPath('admin'); setIsMobileMenuOpen(false)}}>Admin</button>
              <div className="flex justify-around border-t border-white/10 pt-4">
                 <button onClick={toggleMusic} className="p-2">{musicPlaying ? <Volume2Icon size={24}/> : <VolumeXIcon size={24}/>}</button>
                 <button onClick={() => setIsDarkMode(!isDarkMode)} className="p-2"><SunIcon size={24}/></button>
              </div>
            </div>
          )}
        </nav>
      );

      const Countdown = () => {
        const [t, setT] = useState({ d: 0, h: 0, m: 0, s: 0 });
        const [isFinished, setIsFinished] = useState(false);

        useEffect(() => {
          const timer = setInterval(() => {
            const dist = ANNOUNCEMENT_DATE - new Date().getTime();
            if (dist < 0) {
              setIsFinished(true);
              return clearInterval(timer);
            }
            setT({
              d: Math.floor(dist / 86400000), h: Math.floor((dist % 86400000) / 3600000),
              m: Math.floor((dist % 3600000) / 60000), s: Math.floor((dist % 60000) / 1000)
            });
          }, 1000);
          return () => clearInterval(timer);
        }, []);

        if (isFinished) {
          return (
            <div className="my-10 bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 px-6 py-3 rounded-2xl animate-pulse font-black uppercase text-sm tracking-widest no-print">
              🎉 PENGUMUMAN SUDAH DIMULAI & DAPAT DIAKSES 🎉
            </div>
          );
        }

        return (
          <div className="flex justify-center space-x-2 md:space-x-4 my-10 no-print">
            {[ {l:'Hari',v:t.d}, {l:'Jam',v:t.h}, {l:'Menit',v:t.m}, {l:'Detik',v:t.s} ].map((x,i)=>(
              <div key={i} className="text-center">
                <div className="w-14 h-14 md:w-20 md:h-20 bg-white/10 backdrop-blur rounded-2xl flex items-center justify-center border border-white/20 mb-1">
                  <span className="text-xl md:text-3xl font-bold">{x.v}</span>
                </div>
                <span className="text-[8px] md:text-[10px] uppercase font-bold text-slate-400">{x.l}</span>
              </div>
            ))}
          </div>
        );
      };

      const HomePage = () => (
        <div className="min-h-[calc(100vh-80px)] bg-slate-900 text-white flex flex-col items-center justify-center p-6 text-center">
          <div className="bg-yellow-500/10 border border-yellow-500/30 text-yellow-500 px-4 py-1 rounded-full text-[10px] font-bold mb-6">TA 2025/2026</div>
          <h1 className="text-3xl md:text-6xl font-black mb-4 uppercase tracking-tighter">PENGUMUMAN <span className="text-yellow-500">KELULUSAN</span></h1>
          <p className="max-w-xl text-slate-400 text-xs md:text-base mb-10 leading-relaxed font-light">
            Selamat datang di portal resmi Pengumuman Kelulusan SMP Negeri 1 Bandar Lampung Tahun Ajaran 2025/2026. Silakan cek hasil kelulusan Anda secara cepat, aman, dan mudah dengan memasukkan NISN pada kolom yang tersedia
          </p>
          <Countdown />
          <button onClick={() => setCurrentPath('cek')} className="bg-yellow-500 text-slate-900 px-8 py-4 md:px-10 md:py-5 rounded-2xl font-black text-sm md:text-lg hover:scale-105 transition-transform flex items-center shadow-2xl shadow-yellow-500/30">
            <SearchIcon className="mr-3" size={24}/> CEK KELULUSAN
          </button>
        </div>
      );

      const CekKelulusanPage = () => (
        <div className="min-h-[calc(100vh-80px)] dark:bg-slate-900 bg-slate-50 p-6 flex flex-col items-center pt-12">
          <div className="w-full max-w-xl bg-white dark:bg-slate-800 p-6 md:p-8 rounded-3xl shadow-xl border border-slate-200 dark:border-slate-700 no-print">
            <h2 className="text-xl md:text-2xl font-bold dark:text-white mb-2 text-center uppercase tracking-tight">Status Kelulusan</h2>
            <p className="text-[10px] text-slate-500 dark:text-slate-400 text-center mb-6 max-w-xs mx-auto">
              Silakan masukkan NISN valid Anda untuk melihat hasil evaluasi akhir.
            </p>
            <form onSubmit={handleSearch} className="flex flex-col space-y-4">
              <input 
                type="text" 
                placeholder="NISN (10 Digit)" 
                className="w-full p-4 md:p-5 rounded-2xl border-2 dark:bg-slate-900 dark:border-slate-700 dark:text-white focus:border-blue-500 outline-none transition-all font-mono text-center text-lg"
                value={searchQuery}
                onChange={e => setSearchQuery(e.target.value.replace(/\D/g,''))}
              />
              <button disabled={searchResult === 'loading'} className="bg-blue-600 text-white py-4 md:py-5 rounded-2xl font-black text-lg hover:bg-blue-700 transition-all disabled:opacity-50">
                {searchResult === 'loading' ? 'MENCARI...' : 'LIHAT HASIL'}
              </button>
            </form>
          </div>

          <div className="mt-8 w-full max-w-3xl">
            {searchResult === 'not_started' && (
              <div className="bg-amber-50 dark:bg-amber-900/20 p-8 rounded-3xl border border-amber-200 dark:border-amber-800 text-center animate-fade-in-up">
                <ShieldAlertIcon className="mx-auto text-amber-500 mb-4" size={40}/>
                <h3 className="text-lg font-bold text-amber-600 dark:text-amber-400 uppercase">Pengumuman Belum Dimulai!</h3>
                <p className="text-xs text-amber-500 mt-2 italic">Akses masuk dan pengecekan kelulusan baru akan dibuka secara resmi pada tanggal 1 Juni 2026 pkl. 23.59 WIB.</p>
              </div>
            )}

            {searchResult === 'not_found' && (
              <div className="bg-red-50 dark:bg-red-900/20 p-8 rounded-3xl border border-red-200 dark:border-red-800 text-center animate-fade-in-up">
                <ShieldAlertIcon className="mx-auto text-red-500 mb-4" size={40}/>
                <h3 className="text-lg font-bold text-red-600 dark:text-red-400 uppercase">Data Tidak Ditemukan</h3>
                <p className="text-xs text-red-500 mt-2 italic">Pastikan NISN yang dimasukkan sudah benar atau hubungi bagian kesiswaan.</p>
              </div>
            )}
            
            {typeof searchResult === 'object' && searchResult !== null && (
              <div className="bg-white dark:bg-slate-800 p-8 md:p-10 rounded-[2rem] shadow-2xl border-t-[10px] border-emerald-500 animate-fade-in-up relative overflow-hidden">
                <div className="flex flex-col md:flex-row gap-8 items-center">
                  <div className="flex-1 text-center md:text-left w-full">
                    <p className="text-[8px] text-slate-400 uppercase font-bold tracking-widest mb-1">PROFIL SISWA</p>
                    <h3 className="text-2xl md:text-3xl font-black dark:text-white uppercase mb-1 leading-tight">{searchResult.name}</h3>
                    <p className="text-blue-500 font-mono text-lg mb-6">{searchResult.nisn}</p>
                    
                    <div className="bg-slate-50 dark:bg-slate-900/50 p-4 rounded-2xl mb-6">
                      <p className="text-[8px] text-slate-500 uppercase font-bold">Kelas</p>
                      <p className="text-lg font-black dark:text-white">{searchResult.kelas}</p>
                    </div>

                    <div className={`py-6 px-4 rounded-3xl font-black text-4xl md:text-6xl text-center shadow-inner ${
                      searchResult.status === 'LULUS' ? 'bg-emerald-500 text-white' : 'bg-red-600 text-white'
                    }`}>
                      {searchResult.status}
                    </div>
                  </div>

                  <div className="flex flex-col items-center bg-slate-50 dark:bg-slate-900/80 p-5 rounded-3xl border border-dashed border-slate-300 dark:border-slate-600">
                    <div className="bg-white p-2 rounded-xl shadow-lg">
                       <img 
                        src={`https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${encodeURIComponent(window.location.origin + window.location.pathname + '?nisn=' + searchResult.nisn)}`}
                        alt="QR" className="w-28 h-28 md:w-36 md:h-36"
                      />
                    </div>
                    <button onClick={() => downloadQR(searchResult.nisn)} className="mt-4 text-[10px] text-blue-600 font-bold hover:underline no-print flex items-center">
                      <DownloadIcon size={12} className="mr-1"/> SIMPAN QR
                    </button>
                  </div>
                </div>
              </div>
            )}
          </div>
        </div>
      );

      const AdminPage = () => {
        if (!isAdminLoggedIn) {
          return (
            <div className="min-h-[calc(100vh-80px)] bg-slate-900 flex items-center justify-center p-6">
              <div className="w-full max-w-sm bg-white dark:bg-slate-800 p-8 rounded-3xl shadow-2xl">
                <div className="text-center mb-8">
                  <div className="bg-blue-100 dark:bg-blue-900/30 w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-4 text-blue-600"><LockIcon size={32}/></div>
                  <h2 className="text-xl font-bold dark:text-white uppercase tracking-tight">Admin Portal</h2>
                  <p className="text-slate-500 text-xs">Masukkan PIN akses untuk manajemen data.</p>
                </div>
                <form onSubmit={handleAdminLogin} className="space-y-4">
                  <input 
                    type="password" placeholder="PIN" 
                    className="w-full p-4 rounded-2xl border-2 dark:bg-slate-900 dark:border-slate-700 dark:text-white text-center text-xl tracking-[0.5em] font-mono"
                    value={adminPin} onChange={e => setAdminPin(e.target.value)}
                  />
                  <button className="w-full bg-blue-600 text-white py-4 rounded-2xl font-black hover:bg-blue-700 transition-all uppercase text-sm">Masuk</button>
                </form>
              </div>
            </div>
          );
        }
        return (
          <div className="p-4 md:p-8 dark:bg-slate-900 bg-slate-50 min-h-[calc(100vh-80px)]">
            <div className="max-w-7xl mx-auto">
              <div className="flex flex-col md:flex-row justify-between items-start md:items-center mb-8 gap-4">
                <div>
                  <h2 className="text-2xl font-black dark:text-white uppercase tracking-tighter">Database Siswa</h2>
                  <p className="text-slate-500 text-xs font-semibold">Total: {studentsData.length} Peserta Didik</p>
                </div>
                <div className="flex flex-wrap gap-2">
                  <button onClick={() => setIsAdminLoggedIn(false)} className="bg-red-50 text-red-600 px-4 py-2 rounded-xl text-[10px] font-bold flex items-center hover:bg-red-100 uppercase tracking-widest transition-all"><LogOutIcon size={14} className="mr-2"/> Keluar</button>
                </div>
              </div>

              <div className="bg-white dark:bg-slate-800 rounded-3xl shadow-xl overflow-hidden border border-slate-100 dark:border-slate-700">
                <div className="overflow-x-auto">
                  <table className="w-full text-left text-xs">
                    <thead className="bg-slate-900 text-white uppercase text-[9px] font-bold tracking-[0.2em]">
                      <tr>
                        <th className="p-4">NISN</th>
                        <th className="p-4">Nama</th>
                        <th className="p-4">Kelas</th>
                        <th className="p-4">Status</th>
                        <th className="p-4 text-center">Aksi</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-slate-100 dark:divide-slate-700">
                      {studentsData.map(s => (
                        <tr key={s.id} className="hover:bg-slate-50 dark:hover:bg-slate-900/30 transition-colors">
                          <td className="p-4 font-mono dark:text-white">{s.nisn}</td>
                          <td className="p-4 font-bold dark:text-white uppercase">{s.name}</td>
                          <td className="p-4 text-slate-500 font-semibold">{s.kelas}</td>
                          <td className="p-4">
                            <span className={`text-[9px] font-black px-3 py-1 rounded-full ${
                              s.status === 'LULUS' ? 'bg-emerald-100 text-emerald-700' : 'bg-red-100 text-red-700'
                            }`}>{s.status}</span>
                          </td>
                          <td className="p-4">
                            <div className="flex justify-center gap-1">
                              <button 
                                onClick={() => setEditingStudent(s)}
                                className="p-2 text-blue-600 hover:bg-blue-50 rounded-lg transition-all"
                              >
                                <EditIcon size={16}/>
                              </button>
                              <button 
                                onClick={() => setDeletingStudent(s)}
                                className="p-2 text-red-600 hover:bg-red-50 rounded-lg transition-all"
                              >
                                <Trash2Icon size={16}/>
                              </button>
                            </div>
                          </td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>
            </div>

            {/* MODAL EDIT */}
            {editingStudent && (
              <div className="fixed inset-0 z-[100] flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-sm">
                <div className="bg-white dark:bg-slate-800 w-full max-w-md p-6 rounded-[2rem] shadow-2xl animate-fade-in-up">
                  <h3 className="text-lg font-black dark:text-white uppercase mb-4 border-b dark:border-slate-700 pb-3">Edit Data Siswa</h3>
                  <form onSubmit={updateStudent} className="space-y-4">
                    <div>
                      <label className="text-[10px] font-bold text-slate-400 uppercase">Nama Lengkap</label>
                      <input name="name" defaultValue={editingStudent.name} className="w-full p-3 rounded-xl border dark:bg-slate-900 dark:border-slate-700 dark:text-white mt-1 uppercase" required />
                    </div>
                    <div className="grid grid-cols-2 gap-4">
                      <div>
                        <label className="text-[10px] font-bold text-slate-400 uppercase">NISN</label>
                        <input name="nisn" defaultValue={editingStudent.nisn} className="w-full p-3 rounded-xl border dark:bg-slate-900 dark:border-slate-700 dark:text-white mt-1 font-mono" required />
                      </div>
                      <div>
                        <label className="text-[10px] font-bold text-slate-400 uppercase">Kelas</label>
                        <input name="kelas" defaultValue={editingStudent.kelas} className="w-full p-3 rounded-xl border dark:bg-slate-900 dark:border-slate-700 dark:text-white mt-1" required />
                      </div>
                    </div>
                    <div>
                      <label className="text-[10px] font-bold text-slate-400 uppercase">Status Kelulusan</label>
                      <select name="status" defaultValue={editingStudent.status} className="w-full p-3 rounded-xl border dark:bg-slate-900 dark:border-slate-700 dark:text-white mt-1 font-bold">
                        <option value="LULUS">LULUS</option>
                        <option value="TIDAK LULUS">TIDAK LULUS</option>
                        <option value="DITUNDA">DITUNDA</option>
                      </select>
                    </div>
                    <div className="flex gap-2 pt-4">
                      <button type="button" onClick={() => setEditingStudent(null)} className="flex-1 py-3 text-slate-500 font-bold hover:bg-slate-100 rounded-xl transition-all">BATAL</button>
                      <button type="submit" className="flex-1 py-3 bg-blue-600 text-white font-bold rounded-xl hover:bg-blue-700 shadow-lg shadow-blue-500/30 transition-all">SIMPAN PERUBAHAN</button>
                    </div>
                  </form>
                </div>
              </div>
            )}

            {/* MODAL HAPUS */}
            {deletingStudent && (
              <div className="fixed inset-0 z-[100] flex items-center justify-center p-4 bg-slate-950/60 backdrop-blur-sm">
                <div className="bg-white dark:bg-slate-800 w-full max-w-xs p-6 rounded-[2rem] text-center shadow-2xl">
                  <div className="bg-red-100 dark:bg-red-900/30 w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-4 text-red-600">
                    <Trash2Icon size={30}/>
                  </div>
                  <h3 className="text-sm font-black dark:text-white uppercase mb-2">Konfirmasi Hapus</h3>
                  <p className="text-[10px] text-slate-500 mb-6">Anda yakin ingin menghapus data <b>{deletingStudent.name}</b>? Tindakan ini tidak dapat dibatalkan.</p>
                  <div className="flex gap-2">
                    <button onClick={() => setDeletingStudent(null)} className="flex-1 py-2 text-slate-400 font-bold hover:bg-slate-100 rounded-lg">BATAL</button>
                    <button onClick={deleteStudent} className="flex-1 py-2 bg-red-600 text-white font-bold rounded-lg hover:bg-red-700">HAPUS</button>
                  </div>
                </div>
              </div>
            )}
          </div>
        );
      };

      return (
        <div className={isDarkMode ? 'dark bg-slate-900' : 'bg-white'}>
          <audio ref={audioRef} loop src="https://cdn.pixabay.com/download/audio/2022/05/27/audio_1808fbf07a.mp3?filename=ambient-piano-amp-strings-10711.mp3" />
          <Toast />
          <Navbar />
          <main className="min-h-[calc(100vh-160px)]">
            {currentPath === 'home' && <HomePage />}
            {currentPath === 'cek' && <CekKelulusanPage />}
            {currentPath === 'admin' && <AdminPage />}
          </main>
          <footer className="p-8 bg-slate-950 text-slate-500 text-[10px] text-center border-t border-white/5 no-print uppercase tracking-widest font-medium footer-text">
            © 2026 SMP Negeri 1 Bandar Lampung • Official Studiolpg Creative
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
