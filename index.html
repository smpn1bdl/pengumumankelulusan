  <style>

</head>
<body class="bg-white dark:bg-slate-900 transition-colors duration-300">

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // --- ICON COMPONENTS (Inline SVGs) ---
    const SearchIcon = ({ size = 20, className = "" }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>

    const MoonIcon = ({ size = 20, className = "" }) => (

    const SunIcon = ({ size = 20, className = "" }) => (

    const DownloadIcon = ({ size = 20, className = "" }) => (

    const PrinterIcon = ({ size = 20, className = "" }) => (

    const UserIcon = ({ size = 20, className = "" }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
    );
    const LockIcon = ({ size = 20, className = "" }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
    );
    const LogOutIcon = ({ size = 20, className = "" }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" x2="9" y1="12" y2="12"/></svg>
    );
    const FileSpreadsheetIcon = ({ size = 20, className = "" }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/><path d="M8 13h2"/><path d="M8 17h2"/><path d="M14 13h2"/><path d="M14 17h2"/></svg>
    );
    const PlusIcon = ({ size = 20, className = "" }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><line x1="12" x2="12" y1="5" y2="19"/><line x1="5" x2="19" y1="12" y2="12"/></svg>
    );
    const EditIcon = ({ size = 20, className = "" }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>

    const Trash2Icon = ({ size = 20, className = "" }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" x2="10" y1="11" y2="17"/><line x1="14" x2="14" y1="11" y2="17"/></svg>
    );
    const GraduationCapIcon = ({ size = 20, className = "" }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M21.42 10.922a1 1 0 0 0-.019-1.838L12.83 5.18a2 2 0 0 0-1.66 0L2.6 9.08a1 1 0 0 0 0 1.832l8.57 3.91a2 2 0 0 0 1.66 0z"/><path d="M6 12v5c0 2 2 3 6 3s6-1 6-3v-5"/></svg>
    );
    const ShieldAlertIcon = ({ size = 20, className = "" }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/></svg>
    );
    const Volume2Icon = ({ size = 20, className = "" }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>
    );
    const VolumeXIcon = ({ size = 20, className = "" }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="22" x2="16" y1="9" y2="15"/><line x1="16" x2="22" y1="9" y2="15"/></svg>
    );
    const MenuIcon = ({ size = 24, className = "" }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="18" y2="18"/></svg>
    );
    const PartyPopperIcon = ({ size = 20, className = "" }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M5.8 11.3 2 22l10.7-3.8"/><path d="M4 14h.01"/><path d="M17 14h.01"/><path d="M11 12h.01"/><path d="m12 2 1 1-1 1"/><path d="M15 3h.01"/><path d="M22 2v10a8 8 0 0 1-16 0V2z"/></svg>
    );
    const BadgeCheckIcon = ({ size = 20, className = "" }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M3.85 8.62a4 4 0 0 1 4.78-4.77 4 4 0 0 1 6.74 0 4 4 0 0 1 4.78 4.78 4 4 0 0 1 0 6.74 4 4 0 0 1-4.78 4.78 4 4 0 0 1-6.74 0 4 4 0 0 1-4.78-4.78 4 4 0 0 1 0-6.74z"/><path d="m9 12 2 2 4-4"/></svg>
    );

    // --- DATA SISWA INITIAL ---
    const INITIAL_STUDENTS = [
      { id: 1, nisn: "0012345678", name: "Budi Santoso", kelas: "IX A", status: "LULUS" },
      { id: 2, nisn: "0012345679", name: "Siti Aminah", kelas: "IX B", status: "LULUS" },
      { id: 3, nisn: "0012345680", name: "Andi Wijaya", kelas: "IX C", status: "TIDAK LULUS" },
      { id: 4, nisn: "0012345681", name: "Rina Melati", kelas: "IX A", status: "LULUS" },
      { id: 5, nisn: "0012345682", name: "Dimas Anggara", kelas: "IX B", status: "DITUNDA" },
    ];

    const ANNOUNCEMENT_DATE = new Date("2026-06-01T23:59:00+07:00").getTime();
    
    // 👇 GANTI DENGAN URL WEB APP GOOGLE APPS SCRIPT ANDA
    const GAS_URL = "https://script.google.com/macros/s/AKfycbyuccQQNle304Ulu8t8wTlmW4AbANLoBtTMhNAaM7F0taQ4gQfQw4gJ2xJN_3mRin-3Qw/exec"; 

    // --- MAIN REACT COMPONENT ---
    function App() {
      const [currentPath, setCurrentPath] = useState('home');
      const [isDarkMode, setIsDarkMode] = useState(false);
      const [isFullscreen, setIsFullscreen] = useState(false);
      const [isMobileMenuOpen, setIsMobileMenuOpen] = useState(false);
      const [musicPlaying, setMusicPlaying] = useState(false);
      
      const [searchQuery, setSearchQuery] = useState('');
      const [searchResult, setSearchResult] = useState(null); 
      const [searchAttempts, setSearchAttempts] = useState(0);
      
      const [isAdminLoggedIn, setIsAdminLoggedIn] = useState(false);
      const [adminPin, setAdminPin] = useState('');
      const [studentsData, setStudentsData] = useState(INITIAL_STUDENTS);
      const [isLoadingData, setIsLoadingData] = useState(false); // Tambahan state loading data

      const [toast, setToast] = useState({ show: false, message: '', type: 'success' });

      const audioRef = useRef(null);
      const fileInputRef = useRef(null);

      // 👉 EFEK FETCH DATA DARI SPREADSHEET SAAT APLIKASI DIBUKA
      useEffect(() => {
        if (GAS_URL) {
          setIsLoadingData(true);
          fetch(`${GAS_URL}?action=getData`)
            .then(res => res.json())
            .then(res => {
              if (res.status === 'success' && res.data) {
                // Beri ID unik jika Spreadsheet tidak menyediakan kolom id
                const formattedData = res.data.map((item, index) => ({
                  id: item.id || index + 1,
                  ...item
                }));
                setStudentsData(formattedData);
                showToast('Data berhasil dimuat dari Spreadsheet', 'success');
              }
            })
            .catch(err => {
              console.error("Gagal menyambung ke Spreadsheet:", err);
              showToast('Gagal memuat Database Spreadsheet', 'error');
            })
            .finally(() => setIsLoadingData(false));
        }
      }, []);

      useEffect(() => {
        if (isDarkMode) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      }, [isDarkMode]);

      const showToast = (message, type = 'success') => {
        setToast({ show: true, message, type });
        setTimeout(() => setToast({ show: false, message: '', type: 'success' }), 3000);
      };

      const toggleFullscreen = () => {
        if (!document.fullscreenElement) {
          document.documentElement.requestFullscreen().catch(err => {
            showToast(`Gagal layar penuh: ${err.message}`, 'error');
          });
          setIsFullscreen(true);
        } else {
          if (document.exitFullscreen) {
            document.exitFullscreen();
            setIsFullscreen(false);
          }
        }
      };

      const toggleMusic = () => {
        if (musicPlaying) {
          audioRef.current?.pause();
        } else {
          audioRef.current?.play().catch(() => showToast("Autoplay diblokir browser, klik manual.", "error"));
        }
        setMusicPlaying(!musicPlaying);
      };

      const handleSearch = (e) => {
        e.preventDefault();
        if (!searchQuery.trim()) {
          showToast('Silakan masukkan NISN', 'error');
          return;
        }
        setSearchResult('loading');
        setTimeout(() => {
          const result = studentsData.find(s => s.nisn === searchQuery);
          if (result) {
            setSearchResult(result);
            showToast('Data ditemukan!', 'success');
          } else {
            setSearchResult('not_found');
            showToast('Data tidak ditemukan', 'error');
          }
        }, 1000);
      };

      const handleAdminLogin = (e) => {
        if (e) e.preventDefault();
        if (adminPin === 'admin1') {
          setIsAdminLoggedIn(true);
          showToast('Login Admin Berhasil', 'success');
        } else {
          showToast('PIN Salah', 'error');
        }
      };

      const downloadCSVTemplate = () => {
        const headers = "nisn,name,kelas,status\n";
        const sampleData = "0012345683,Siswa Contoh,IX A,LULUS\n";
        const blob = new Blob([headers + sampleData], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.setAttribute("href", url);
        link.setAttribute("download", "template_siswa_smpn1.csv");
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      };

      const handleFileUpload = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
          const text = event.target.result;
          try {
            const lines = text.split('\n').filter(line => line.trim() !== '');
            const headers = lines[0].toLowerCase().split(',').map(h => h.trim());
            const newStudents = [];
            for (let i = 1; i < lines.length; i++) {
              const vals = lines[i].split(',').map(v => v.trim());
              if (vals.length >= headers.length) {
                const student = { id: Date.now() + i };
                headers.forEach((h, idx) => { student[h] = vals[idx]; });
                newStudents.push(student);
              }
            }
            setStudentsData(prev => [...prev, ...newStudents]);
            showToast(`${newStudents.length} data ditambahkan`, "success");
          } catch (err) { showToast("Gagal proses CSV", "error"); }
        };
        reader.readAsText(file);
      };

      const downloadQR = (nisn) => {
        const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=${encodeURIComponent(window.location.href + '?nisn=' + nisn)}`;
        fetch(qrUrl).then(res => res.blob()).then(blob => {
          const url = window.URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = `QR_Lulus_${nisn}.png`;
          a.click();
        });
      };

      const Toast = () => toast.show && (
        <div className={`fixed bottom-5 right-5 z-[100] flex items-center p-4 rounded-xl shadow-2xl animate-bounce-short ${toast.type === 'success' ? 'bg-emerald-500' : 'bg-red-500'} text-white`}>
          {toast.type === 'success' ? <CheckCircleIcon size={20} className="mr-2" /> : <XCircleIcon size={20} className="mr-2" />}
          <span className="font-medium">{toast.message}</span>
        </div>
      );

      const Navbar = () => (
        <nav className="sticky top-0 z-50 bg-slate-900/90 backdrop-blur-md border-b border-white/10 text-white px-4 h-20 flex items-center justify-between no-print">
          <div className="flex items-center space-x-3 cursor-pointer" onClick={() => setCurrentPath('home')}>
            <div className="bg-yellow-500 p-2 rounded-xl"><GraduationCapIcon size={24} className="text-slate-900" /></div>
            <div className="hidden sm:block">
              <h1 className="font-bold text-lg leading-tight">SMPN 1</h1>
              <p className="text-[10px] text-yellow-400 font-bold uppercase tracking-widest">Bandar Lampung</p>
            </div>
          </div>
          <div className="hidden md:flex items-center space-x-6">
            <button onClick={() => setCurrentPath('home')} className={currentPath === 'home' ? 'text-yellow-400 font-bold underline' : ''}>Beranda</button>
            <button onClick={() => setCurrentPath('cek')} className={currentPath === 'cek' ? 'text-yellow-400 font-bold underline' : ''}>Pengumuman</button>
            <button onClick={() => setCurrentPath('admin')} className={currentPath === 'admin' ? 'text-yellow-400 font-bold underline' : ''}>Admin</button>
            <div className="flex items-center space-x-3 border-l border-white/20 pl-6">
               <button onClick={toggleMusic} className="p-2 hover:bg-white/10 rounded-full">{musicPlaying ? <Volume2Icon size={20}/> : <VolumeXIcon size={20} className="text-slate-500"/>}</button>
               <button onClick={() => setIsDarkMode(!isDarkMode)} className="p-2 hover:bg-white/10 rounded-full text-yellow-400"><SunIcon size={20}/></button>
               <button onClick={toggleFullscreen} className="p-2 hover:bg-white/10 rounded-full"><MaximizeIcon size={20}/></button>
            </div>
          </div>
          <button onClick={() => setIsMobileMenuOpen(!isMobileMenuOpen)} className="md:hidden p-2"><MenuIcon size={24}/></button>
          {isMobileMenuOpen && (
            <div className="absolute top-20 left-0 w-full bg-slate-800 p-4 border-t border-white/10 flex flex-col space-y-4 md:hidden animate-fade-in-up shadow-2xl">
              <button onClick={() => {setCurrentPath('home'); setIsMobileMenuOpen(false)}}>Beranda</button>
              <button onClick={() => {setCurrentPath('cek'); setIsMobileMenuOpen(false)}}>Pengumuman</button>
              <button onClick={() => {setCurrentPath('admin'); setIsMobileMenuOpen(false)}}>Admin</button>
            </div>
          )}
        </nav>
      );

      const Countdown = () => {
        const [t, setT] = useState({ d: 0, h: 0, m: 0, s: 0 });
        useEffect(() => {
          const timer = setInterval(() => {
            const dist = ANNOUNCEMENT_DATE - new Date().getTime();
            if (dist < 0) return clearInterval(timer);
            setT({
              d: Math.floor(dist / 86400000),
              h: Math.floor((dist % 86400000) / 3600000),
              m: Math.floor((dist % 3600000) / 60000),
              s: Math.floor((dist % 60000) / 1000)
            });
          }, 1000);
          return () => clearInterval(timer);
        }, []);
        return (
          <div className="flex justify-center space-x-4 my-10 no-print">
            {[ {l:'Hari',v:t.d}, {l:'Jam',v:t.h}, {l:'Menit',v:t.m}, {l:'Detik',v:t.s} ].map((x,i)=>(
              <div key={i} className="text-center">
                <div className="w-16 h-16 md:w-20 md:h-20 bg-white/10 backdrop-blur rounded-2xl flex items-center justify-center border border-white/20 mb-1">
                  <span className="text-2xl md:text-3xl font-bold">{x.v}</span>
                </div>
                <span className="text-[10px] uppercase font-bold text-slate-400">{x.l}</span>
              </div>
            ))}
          </div>
        );
      };

      const HomePage = () => (
        <div className="min-h-[calc(100vh-80px)] bg-slate-900 text-white flex flex-col items-center justify-center p-6 text-center">
          <div className="bg-yellow-500/10 border border-yellow-500/30 text-yellow-500 px-4 py-1 rounded-full text-xs font-bold mb-6">TA 2025/2026</div>
          <h1 className="text-4xl md:text-6xl font-black mb-4 uppercase tracking-tighter">PENGUMUMAN <span className="text-yellow-500">KELULUSAN</span></h1>
          <p className="max-w-xl text-slate-400 text-sm md:text-base mb-10 leading-relaxed">Selamat datang di Portal Resmi Pengumuman Kelulusan Siswa Kelas IX SMPN 1 Bandar Lampung.</p>
          <Countdown />
          <button onClick={() => setCurrentPath('cek')} className="bg-yellow-500 text-slate-900 px-10 py-5 rounded-2xl font-black hover:scale-110 transition-transform flex items-center shadow-2xl shadow-yellow-500/30">
            <SearchIcon className="mr-3" size={24}/> CEK KELULUSAN
          </button>
        </div>
      );

      const CekKelulusanPage = () => (
        <div className="min-h-[calc(100vh-80px)] dark:bg-slate-900 bg-slate-50 p-6 flex flex-col items-center pt-12">
          <div className="w-full max-w-xl bg-white dark:bg-slate-800 p-8 rounded-3xl shadow-xl border border-slate-200 dark:border-slate-700 no-print">
            <h2 className="text-2xl font-bold dark:text-white mb-2 text-center uppercase tracking-tight">Cek Status Anda</h2>
            <p className="text-[10px] text-slate-500 dark:text-slate-400 text-center mb-6 max-w-xs mx-auto leading-relaxed font-sans">
              Masukkan NISN Anda pada kolom yang tersedia untuk melihat hasil pengumuman kelulusan.
            </p>
            <form onSubmit={handleSearch} className="flex flex-col space-y-4">
              <div className="relative">
                 <input 
                  type="text" 
                  placeholder="Masukkan NISN 10 Digit" 
                  className="w-full p-5 rounded-2xl border-2 dark:bg-slate-900 dark:border-slate-700 dark:text-white focus:border-blue-500 outline-none transition-all font-mono text-center text-lg"
                  value={searchQuery}
                  onChange={e => setSearchQuery(e.target.value.replace(/\D/g,''))}
                />
              </div>
              <button disabled={searchResult === 'loading' || isLoadingData} className="bg-blue-600 text-white py-5 rounded-2xl font-black text-lg hover:bg-blue-700 flex justify-center items-center shadow-lg transition-all disabled:opacity-50">
                {searchResult === 'loading' || isLoadingData ? <div className="w-6 h-6 border-4 border-white border-t-transparent animate-spin rounded-full"/> : 'PROSES DATA'}
              </button>
            </form>
          </div>

          <div className="mt-8 w-full max-w-3xl">
            {searchResult === 'not_found' && (
              <div className="bg-red-50 dark:bg-red-900/20 p-10 rounded-3xl border border-red-200 dark:border-red-800 text-center animate-fade-in-up no-print">
                <ShieldAlertIcon className="mx-auto text-red-500 mb-4" size={50}/>
                <h3 className="text-xl font-bold text-red-600 dark:text-red-400">DATA TIDAK DITEMUKAN</h3>
                <p className="text-sm text-red-500 mt-2 italic">NISN yang anda masukkan tidak terdaftar dalam database kami. Silakan cek kembali atau hubungi Admin Sekolah.</p>
              </div>
            )}
            
            {typeof searchResult === 'object' && searchResult !== null && (
              <div className="bg-white dark:bg-slate-800 p-10 rounded-[2.5rem] shadow-[0_35px_60px_-15px_rgba(0,0,0,0.3)] border-t-[12px] border-emerald-500 animate-fade-in-up relative overflow-hidden">
                {searchResult.status === 'LULUS' && (
                  <div className="absolute top-0 right-0 p-4 opacity-10 pointer-events-none">
                    <PartyPopperIcon size={150} />
                  </div>
                )}
                
                <div className="flex flex-col md:flex-row gap-8 items-center md:items-start">
                  {/* Info Siswa */}
                  <div className="flex-1 text-center md:text-left">
                    <p className="text-[10px] text-slate-400 uppercase font-bold tracking-[0.2em] mb-1">Identitas Siswa</p>
                    <h3 className="text-3xl font-black dark:text-white uppercase mb-1 leading-tight tracking-tight">{searchResult.name}</h3>
                    <p className="text-blue-500 font-mono text-lg mb-6">NISN: {searchResult.nisn}</p>
                    
                    <div className="grid grid-cols-1 gap-4 mb-8">
                      <div className="bg-slate-50 dark:bg-slate-900/50 p-5 rounded-2xl border border-slate-100 dark:border-slate-700">
                        <p className="text-[10px] text-slate-500 uppercase font-bold mb-1">Kelas / Rombel</p>
                        <p className="text-xl font-black dark:text-white">{searchResult.kelas}</p>
                      </div>
                    </div>

                    {/* STATUS LULUS BESAR */}
                    <div className={`mt-4 transform transition-all duration-700 ${searchResult.status === 'LULUS' ? 'scale-110' : ''}`}>
                      <p className="text-[10px] text-slate-500 uppercase font-black text-center mb-2 tracking-[0.3em]">Status Akhir</p>
                      <div className={`text-center py-6 px-10 rounded-3xl font-black text-5xl md:text-7xl tracking-tighter shadow-inner ${
                        searchResult.status === 'LULUS' 
                        ? 'bg-emerald-500 text-white shadow-emerald-900/20 animate-pulse' 
                        : 'bg-red-600 text-white shadow-red-900/20'
                      }`}>
                        {searchResult.status}
                      </div>
                      {searchResult.status === 'LULUS' && (
                        <div className="flex items-center justify-center mt-4 text-emerald-600 font-bold uppercase text-xs tracking-widest gap-2">
                          <BadgeCheckIcon size={18}/> Terverifikasi oleh Sistem Sekolah
                        </div>
                      )}
                    </div>
                  </div>

                  {/* QR Code */}
                  <div className="flex flex-col items-center bg-slate-50 dark:bg-slate-900/80 p-6 rounded-[2rem] border border-dashed border-slate-300 dark:border-slate-600 self-center">
                    <p className="text-[10px] text-slate-500 uppercase font-black mb-3 tracking-widest">Validasi Digital</p>
                    <div className="bg-white p-3 rounded-2xl shadow-xl">
                       <img 
                        src={`https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${encodeURIComponent(window.location.href + '?verify=' + searchResult.nisn)}`}
                        alt="QR Verification"
                        className="w-32 h-32 md:w-40 md:h-40"
                      />
                    </div>
                    <button 
                      onClick={() => downloadQR(searchResult.nisn)}
                      className="mt-4 text-[10px] text-blue-600 font-bold hover:underline flex items-center bg-blue-50 dark:bg-blue-900/20 px-3 py-1 rounded-full no-print"
                    >
                      <DownloadIcon size={14} className="mr-1"/> DOWNLOAD QR
                    </button>
                  </div>
                </div>

                <div className="mt-10 pt-6 border-t border-slate-100 dark:border-slate-700 text-center md:text-left">
                  <p className="text-[10px] text-slate-400 italic">
                    *Halaman ini merupakan bukti resmi hasil kelulusan sementara. Silakan simpan tangkapan layar (screenshot) sebagai arsip pribadi. 
                  </p>
                </div>
              </div>
            )}
          </div>
        </div>
      );

      const AdminPage = () => {
        if (!isAdminLoggedIn) {
          return (
            <div className="min-h-[calc(100vh-80px)] bg-slate-900 flex items-center justify-center p-6">
              <div className="w-full max-w-md bg-white dark:bg-slate-800 p-8 rounded-3xl shadow-2xl">
                <div className="text-center mb-8">
                  <div className="bg-blue-100 dark:bg-blue-900/30 w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-4 text-blue-600"><LockIcon size={32}/></div>
                  <h2 className="text-2xl font-bold dark:text-white uppercase tracking-tight">Login Admin</h2>
                  <p className="text-slate-500 text-sm">Akses terbatas untuk Pengelola Data.</p>
                </div>
                <form onSubmit={handleAdminLogin} className="space-y-4">
                  <input 
                    type="password" 
                    placeholder="PIN Keamanan" 
                    className="w-full p-4 rounded-2xl border-2 dark:bg-slate-900 dark:border-slate-700 dark:text-white text-center text-xl tracking-[0.5em] font-mono"
                    value={adminPin}
                    onChange={e => setAdminPin(e.target.value)}
                  />
                  <button className="w-full bg-blue-600 text-white py-4 rounded-2xl font-black hover:bg-blue-700 transition-all shadow-lg uppercase">Masuk</button>
                </form>
              </div>
            </div>
          );
        }
        return (
          <div className="p-4 md:p-8 dark:bg-slate-900 bg-slate-50 min-h-[calc(100vh-80px)]">
            <div className="max-w-7xl mx-auto">
              <div className="flex flex-col md:flex-row justify-between items-start md:items-center mb-8 gap-4">
                <div>
                  <h2 className="text-3xl font-black dark:text-white uppercase tracking-tighter">DATA KELULUSAN</h2>
                  <p className="text-slate-500">Kelola informasi kelulusan siswa SMPN 1</p>
                </div>
                <div className="flex flex-wrap gap-2">
                  <button onClick={downloadCSVTemplate} className="bg-slate-200 dark:bg-slate-700 px-5 py-2.5 rounded-xl text-xs font-bold flex items-center dark:text-white hover:bg-slate-300 transition-colors"><DownloadIcon size={16} className="mr-2"/> TEMPLATE</button>
                  <button onClick={() => fileInputRef.current.click()} className="bg-emerald-500 text-white px-5 py-2.5 rounded-xl text-xs font-bold flex items-center hover:bg-emerald-600 shadow-lg transition-all"><FileSpreadsheetIcon size={16} className="mr-2"/> IMPORT CSV</button>
                  <input type="file" ref={fileInputRef} className="hidden" accept=".csv" onChange={handleFileUpload}/>
                  <button onClick={() => setIsAdminLoggedIn(false)} className="bg-red-50 text-red-600 px-5 py-2.5 rounded-xl text-xs font-bold flex items-center hover:bg-red-100"><LogOutIcon size={16} className="mr-2"/> KELUAR</button>
                </div>
              </div>
              <div className="bg-white dark:bg-slate-800 rounded-[2rem] shadow-xl overflow-hidden border border-slate-100 dark:border-slate-700">
                <div className="overflow-x-auto">
                  <table className="w-full text-left">
                    <thead className="bg-slate-50 dark:bg-slate-900/50 dark:text-slate-400 text-[10px] uppercase font-black text-slate-400 tracking-widest border-b border-slate-100 dark:border-slate-700">
                      <tr>
                        <th className="p-5">NISN</th>
                        <th className="p-5">NAMA SISWA</th>
                        <th className="p-5">KELAS</th>
                        <th className="p-5">STATUS</th>
                        <th className="p-5 text-center">AKSI</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-slate-100 dark:divide-slate-700">
                      {studentsData.map(s => (
                        <tr key={s.id} className="hover:bg-slate-50 dark:hover:bg-slate-900/30 transition-colors">
                          <td className="p-5 font-mono text-sm dark:text-white">{s.nisn}</td>
                          <td className="p-5 font-bold dark:text-white uppercase">{s.name}</td>
                          <td className="p-5 text-slate-500 text-sm font-semibold">{s.kelas}</td>
                          <td className="p-5">
                            <span className={`text-[10px] font-black px-3 py-1 rounded-full ${
                              s.status === 'LULUS' ? 'bg-emerald-100 text-emerald-700' : 'bg-red-100 text-red-700'
                            }`}>{s.status}</span>
                          </td>
                          <td className="p-5 text-center text-slate-400">
                            <div className="flex justify-center gap-2">
                              <button className="p-2 hover:bg-blue-50 hover:text-blue-500 rounded-lg transition-colors"><EditIcon size={16}/></button>
                              <button className="p-2 hover:bg-red-50 hover:text-red-500 rounded-lg transition-colors"><Trash2Icon size={16}/></button>
                            </div>
                          </td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>
            </div>
          </div>
        );
      };

      return (
        <div className={isDarkMode ? 'dark bg-slate-900' : 'bg-white'}>
          <audio ref={audioRef} loop src="https://cdn.pixabay.com/download/audio/2022/05/27/audio_1808fbf07a.mp3?filename=ambient-piano-amp-strings-10711.mp3" />
          <Toast />
          <Navbar />
          <main className="min-h-screen">
            {currentPath === 'home' && <HomePage />}
            {currentPath === 'cek' && <CekKelulusanPage />}
            {currentPath === 'admin' && <AdminPage />}
          </main>
          <footer className="footer-text p-10 bg-slate-950 text-slate-400 text-xs text-center border-t border-white/5 no-print tracking-normal">
            <div className="max-w-4xl mx-auto opacity-80">
              <p className="mb-2">© 2026 SMP Negeri 1 Bandar Lampung</p>
              <p className="text-[10px] font-light">Integrated Education System • Official Studiolpg Creative</p>
            </div>
          </footer>
        </div>
      );
    }

    // Render React App ke DOM
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
